version: '3.8'

services:
  # ============================================================
  # Next.js приложение
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: blog-app
    ports:
      - "4040:4040"  # ← ИЗМЕНЕНО НА 4040:4040
    environment:
      - NODE_ENV=production
      - PORT=4040  # ← ИЗМЕНЕНО НА 4040
    volumes:
      # Монтируем папку с данными для сохранения постов
      - ./src/data:/app/src/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040"]  # ← ИЗМЕНЕНО НА 4040
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
