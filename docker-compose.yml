services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: blog-app
    ports:
      - "127.0.0.1:4040:4040"  # Чтобы не открыть порт поверх настроек ufw
      
    environment:
      - NODE_ENV=production
      - PORT=4040
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4040/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

